<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(activePage)" class="admin-sidebar">
    <div class="admin-brand">
        <div class="admin-brand-icon">CP</div>
        <div><strong>Civic<span>Pulse</span></strong><small>Smart Governance</small></div>
    </div>

    <div class="admin-section-title">MAIN MENU</div>
    <nav class="admin-nav">
        <a th:href="@{/admin/dashboard}" th:classappend="${activePage == 'dashboard'} ? ' active' : ''"><span>⌂</span>Dashboard</a>
        <a th:href="@{/admin/complaints}" th:classappend="${activePage == 'complaints'} ? ' active' : ''"><span>▣</span>Complaints</a>
        <a th:href="@{/admin/officers}" th:classappend="${activePage == 'officers'} ? ' active' : ''"><span>♙</span>Officers</a>
        <a th:href="@{/admin/citizens}" th:classappend="${activePage == 'citizens'} ? ' active' : ''"><span>♟</span>Citizens</a>
    </nav>

    <div class="admin-section-title">MANAGEMENT</div>
    <nav class="admin-nav">
        <a th:href="@{/admin/reports}" th:classappend="${activePage == 'reports'} ? ' active' : ''"><span>▤</span>Reports</a>
        <a th:href="@{/admin/settings}" th:classappend="${activePage == 'settings'} ? ' active' : ''"><span>⚙</span>Settings</a>
        <a th:href="@{/admin/profile}" th:classappend="${activePage == 'profile'} ? ' active' : ''"><span>◉</span>Profile</a>
    </nav>

    <div class="admin-sidebar-bottom">
        <div class="admin-user-mini"><div class="admin-avatar">A</div><div><strong>Administrator</strong><small>System Admin</small></div></div>
        <form method="post" th:action="@{/logout}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="admin-logout"><span>↪</span>Logout</button>
        </form>
    </div>
</aside>
</body>
</html>

<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Citizens | CivicPulse Admin</title><link rel="stylesheet" th:href="@{/css/admin-sidebar.css}"><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:"Segoe UI",Arial,sans-serif}.main{margin-left:270px;min-height:100vh}.topbar{height:76px;background:#fff;border-bottom:1px solid #e8edf4;padding:0 34px;display:flex;justify-content:space-between;align-items:center}.content{padding:30px 34px}.header{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.header h1{margin:0;font-size:28px}.header p{color:#64748b;margin:7px 0 0}.card{background:#fff;border:1px solid #e7ecf3;border-radius:14px;padding:22px;box-shadow:0 4px 18px rgba(15,23,42,.04)}.stat{margin-bottom:22px}.stat small{color:#64748b}.stat strong{display:block;font-size:30px;margin-top:5px}.search{width:270px;padding:10px 13px;border:1px solid #cbd5e1;border-radius:9px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px 12px;text-align:left;border-bottom:1px solid #edf1f5;font-size:13px}.table th{background:#f8fafc;color:#64748b;font-size:11px;text-transform:uppercase}.role{background:#eff6ff;color:#1d4ed8;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700}.view{border:0;background:#eff6ff;color:#1d4ed8;padding:7px 10px;border-radius:7px;cursor:pointer}.empty{text-align:center;color:#64748b;padding:35px!important}@media(max-width:700px){.main{margin-left:72px}.content{padding:20px}.header{align-items:flex-start;flex-direction:column;gap:15px}.search{width:100%}}
</style></head><body><aside th:replace="~{fragments/admin-sidebar :: sidebar('citizens')}"></aside><main class="main"><header class="topbar"><strong>Citizen Management</strong><span style="color:#64748b">Administrator</span></header><section class="content"><div class="header"><div><h1>Citizens</h1><p>View registered citizens and their account information.</p></div><input id="citizenSearch" class="search" placeholder="Search citizens..."></div><div class="card stat"><small>Total Registered Citizens</small><strong th:text="${totalCitizens}">0</strong></div><div class="card"><table class="table"><thead><tr><th>ID</th><th>Citizen ID</th><th>Full Name</th><th>Username</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th>View</th></tr></thead><tbody id="citizenTable"><tr th:each="citizen : ${citizens}"><td th:text="${citizen.id}">1</td><td th:text="${citizen.citizenId}">CIT-001</td><td th:text="${citizen.fullName}">Citizen</td><td th:text="${citizen.username}">username</td><td th:text="${citizen.email}">email</td><td th:text="${citizen.phone}">phone</td><td><span class="role" th:text="${citizen.role}">CITIZEN</span></td><td th:text="${citizen.active ? 'Active' : 'Inactive'}">Active</td><td><button class="view" type="button" th:attr="data-name=${citizen.fullName},data-email=${citizen.email},data-phone=${citizen.phone},data-address=${citizen.address}">View</button></td></tr><tr th:if="${#lists.isEmpty(citizens)}"><td class="empty" colspan="9">No registered citizens found.</td></tr></tbody></table></div></section></main><script>document.getElementById('citizenSearch').addEventListener('input',function(){let q=this.value.toLowerCase();document.querySelectorAll('#citizenTable tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')});document.querySelectorAll('.view').forEach(b=>b.onclick=()=>alert('Name: '+(b.dataset.name||'N/A')+'\nEmail: '+(b.dataset.email||'N/A')+'\nPhone: '+(b.dataset.phone||'N/A')+'\nAddress: '+(b.dataset.address||'N/A')));</script></body></html>

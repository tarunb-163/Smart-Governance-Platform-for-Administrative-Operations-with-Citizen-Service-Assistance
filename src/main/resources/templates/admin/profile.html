
<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta content="CivicPulse Smart Governance Management Platform" name="description"/>
    <title>Profile | CivicPulse Admin</title>
    <style>

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        body {
            margin: 0;
            background: #f5f7fb;
            color: #172033;
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            position: fixed;

            left: 0;
            top: 0;

            width: 250px;
            height: 100vh;

            background:
                    linear-gradient(
                            180deg,
                            #172554,
                            #1e3a8a
                    );

            color: white;

            padding: 24px 16px;
        }


        .logo {
            font-size: 25px;
            font-weight: 700;

            padding: 8px 12px 30px;
        }


        .logo span {
            color: #60a5fa;
        }


        .menu-title {
            font-size: 11px;

            text-transform: uppercase;

            color: #93c5fd;

            letter-spacing: 1px;

            padding: 15px 14px 8px;
        }


        .menu a {
            display: block;

            color: #dbeafe;

            text-decoration: none;

            padding: 13px 14px;

            margin: 4px 0;

            border-radius: 9px;

            transition: 0.2s;
        }


        .menu a:hover,
        .menu a.active {
            background: #2563eb;

            color: #fff;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            margin-left: 250px;

            min-height: 100vh;
        }


        /* =====================================================
           TOPBAR
        ===================================================== */

        .topbar {
            height: 72px;

            background: #fff;

            border-bottom:
                    1px solid #e5e7eb;

            padding: 0 32px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .topbar strong {
            font-size: 18px;
        }


        .topbar span {
            color: #64748b;

            font-size: 14px;
        }


        /* =====================================================
           CONTENT
        ===================================================== */

        .content {
            padding: 30px 32px;
        }


        .title h1 {
            margin: 0 0 8px;

            font-size: 28px;
        }


        .title p {
            color: #64748b;

            margin: 0;
        }


        /* =====================================================
           GRID
        ===================================================== */

        .grid {
            display: grid;

            grid-template-columns:
                    repeat(2, 1fr);

            gap: 20px;

            margin-top: 25px;
        }


        /* =====================================================
           PANEL
        ===================================================== */

        .panel {
            background: #fff;

            border:
                    1px solid #e8edf4;

            border-radius: 13px;

            padding: 24px;

            box-shadow:
                    0 3px 12px
                    rgba(15,23,42,.04);
        }


        .panel h2 {
            margin-top: 0;

            font-size: 18px;
        }


        /* =====================================================
           PROFILE ITEMS
        ===================================================== */

        .item {
            padding: 14px 0;

            border-bottom:
                    1px solid #eef2f7;

            color: #475569;
        }


        .item:last-child {
            border: 0;
        }


        .item label {
            font-size: 13px;

            color: #64748b;
        }


        .item strong {
            display: inline-block;

            margin-top: 5px;

            color: #172033;

            font-size: 15px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        label {
            font-size: 13px;

            color: #64748b;
        }


        input {
            width: 100%;

            padding: 11px;

            border:
                    1px solid #cbd5e1;

            border-radius: 8px;

            margin-top: 6px;

            font-size: 14px;
        }


        input:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow:
                    0 0 0 3px
                    rgba(37,99,235,.1);
        }


        /* =====================================================
           SAVE BUTTON
        ===================================================== */

        .save-btn {
            margin-top: 18px;

            background: #2563eb;

            color: #fff;

            border: 0;

            padding: 11px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;
        }


        .save-btn:hover {
            background: #1d4ed8;
        }


        /* =====================================================
           LOGOUT SECTION
        ===================================================== */

        .logout-section {
            margin-top: 25px;

            padding-top: 20px;

            border-top:
                    1px solid #e5e7eb;
        }


        .logout-section p {
            margin: 0 0 12px;

            font-size: 13px;

            color: #64748b;
        }


        .logout-btn {
            width: 100%;

            padding: 12px 18px;

            border: none;

            border-radius: 8px;

            background: #dc2626;

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .logout-btn:hover {
            background: #b91c1c;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 800px) {

            .grid {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 700px) {

            .sidebar {
                width: 70px;
            }


            .logo {
                font-size: 0;

                text-align: center;
            }


            .menu-title {
                display: none;
            }


            .menu a {
                text-align: center;

                font-size: 0;
            }


            .menu a:first-letter {
                font-size: 18px;
            }


            .main {
                margin-left: 70px;
            }


            .content {
                padding: 20px;
            }

        }

    </style>
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}"/><style>.profile-message{margin:0 0 18px;padding:12px 15px;border-radius:9px}.profile-message.success{background:#ecfdf3;color:#166534}.profile-message.error{background:#fef2f2;color:#991b1b}</style></head>
<body>
<!-- =========================================================
     SIDEBAR
========================================================= -->
<aside th:replace="~{fragments/admin-sidebar :: sidebar('profile')}"></aside>
<!-- =========================================================
     MAIN
========================================================= -->
<main class="main">
    <!-- =====================================================
             TOPBAR
        ====================================================== -->
    <header class="topbar">
        <strong>
            Admin Profile
        </strong>
        <span>
            Administrator
        </span>
    </header>
    <!-- =====================================================
             CONTENT
        ====================================================== -->
    <section class="content">

        <div th:if="${success}" class="profile-message success" th:text="${success}"></div>
        <div th:if="${error}" class="profile-message error" th:text="${error}"></div>
        <!-- =================================================
                     TITLE
                ================================================== -->
        <div class="title">
            <h1>
                Admin Profile
            </h1>
            <p>
                Manage your administrator profile and account.
            </p>
        </div>
        <!-- =================================================
                     PROFILE GRID
                ================================================== -->
        <div class="grid">
            <!-- =================================================
                             PROFILE INFORMATION
                        ================================================== -->
            <div class="panel">
                <h2>
                    Profile Information
                </h2>
                <div class="item">
                    <label>
                        Name
                    </label>
                    <br/>
                    <strong th:text="${adminName}">
                        Administrator
                    </strong>
                </div>
                <div class="item">
                    <label>
                        Role
                    </label>
                    <br/>
                    <strong th:text="${adminRole}">
                        System Admin
                    </strong>
                </div>
                <div class="item">
                    <label>
                        Account
                    </label>
                    <br/>
                    <strong th:text="${accountType}">
                        Administrator
                    </strong>
                </div>
                <!-- =================================================
                                     LOGOUT
                                ================================================== -->
                <div class="logout-section">
                    <p>
                        Finished managing CivicPulse?
                    </p>
                    <form action="/logout" method="post">
                        <!-- CSRF TOKEN -->
                        <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/>
                        <button class="logout-btn" type="submit">

                            ↪   Logout

                        </button>
                    </form>
                </div>
            </div>
            <!-- =================================================
                             PROFILE SETTINGS
                        ================================================== -->
            <div class="panel">
                <h2>
                    Profile Settings
                </h2>
                <form action="/admin/profile" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <label>

                        Display Name


                        <input name="displayName" required th:value="${adminName}" type="text" value="Administrator"/>
                    </label>
                    <label style="display:block;margin-top:14px">

                        Email


                        <input name="email" required th:value="${adminEmail}" placeholder="admin@example.com" type="email"/>
                    </label>
                    <button class="save-btn" type="submit">

                        Save Changes

                    </button>
                </form>
            </div>
        </div>
    </section>
</main>
</body>
</html>

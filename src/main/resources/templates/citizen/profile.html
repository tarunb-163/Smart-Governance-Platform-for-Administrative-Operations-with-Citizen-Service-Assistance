<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicPulse - My Profile</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            margin: 0;
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
        }
        .top-navbar {
            height: 68px;
            background: #0f2744;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }
        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #60a5fa;
        }
        .brand-name {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .brand-subtitle {
            font-size: 10px;
            color: #93c5fd;
            display: block;
            margin-top: -2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .user-area {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 18px;
            border-left: 1px solid rgba(255, 255, 255, 0.15);
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            min-height: calc(100vh - 68px);
            background: white;
            border-right: 1px solid #e2e8f0;
            position: fixed;
            left: 0;
            top: 68px;
            padding: 20px 12px;
        }
        .portal-label {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 1px;
            padding: 0 12px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            margin-bottom: 4px;
            border-radius: 10px;
            color: #475569;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .sidebar a i {
            font-size: 17px;
            width: 20px;
            text-align: center;
        }
        .sidebar a:hover {
            background: #f1f5f9;
            color: #0f2744;
        }
        .sidebar a.active {
            background: #eff6ff;
            color: #1d4ed8;
            font-weight: 600;
        }
        .sidebar-divider {
            height: 1px;
            background: #e2e8f0;
            margin: 18px 10px;
        }
        .logout-link { color: #dc2626 !important; }
        .logout-link:hover { background: #fee2e2 !important; }

        /* Main Content */
        .main-content {
            margin-left: 240px;
            padding: 32px 36px;
        }
        .profile-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            max-width: 760px;
        }
        .page-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0f2744;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-badge {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-control {
            border-color: #cbd5e1;
            padding: 10px 14px;
            font-size: 0.92rem;
            border-radius: 10px;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .btn-primary {
            background: #1e3a8a;
            border: none;
            padding: 11px 24px;
            font-weight: 600;
            border-radius: 10px;
            font-size: 0.92rem;
        }
        .btn-primary:hover {
            background: #172554;
        }
    </style>
</head>
<body>

<!-- TOP NAVBAR -->
<nav class="top-navbar">
    <a href="/citizen/dashboard" class="brand">
        <div class="brand-icon"><i class="bi bi-buildings-fill"></i></div>
        <div>
            <div class="brand-name">CivicPulse</div>
            <span class="brand-subtitle">Smart Governance Portal</span>
        </div>
    </a>

    <div class="user-area">
        <div class="user-avatar" th:text="${citizen != null and citizen.fullName != null and !#strings.isEmpty(citizen.fullName) ? #strings.substring(citizen.fullName, 0, 1).toUpperCase() : 'C'}">C</div>
        <div class="d-none d-md-block" style="line-height: 1.2;">
            <div style="font-size: 13px; font-weight: 600; color: white;" th:text="${citizen != null ? citizen.fullName : 'Citizen'}">Citizen</div>
            <div style="font-size: 11px; color: #93c5fd;">Registered Citizen</div>
        </div>
    </div>
</nav>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="portal-label">Citizen Menu</div>
    <a href="/citizen/dashboard"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
    <a href="/citizen/complaint-form"><i class="bi bi-plus-circle"></i><span>Register Complaint</span></a>
    <a href="/citizen/complaints"><i class="bi bi-file-earmark-text"></i><span>My Complaints</span></a>
    <a href="/citizen/track"><i class="bi bi-search"></i><span>Track Complaint</span></a>
    <a href="/citizen/notifications"><i class="bi bi-bell"></i><span>Notifications</span></a>
    <a href="/citizen/profile" class="active"><i class="bi bi-person"></i><span>My Profile</span></a>
    <div class="sidebar-divider"></div>
    <a href="/citizen/logout" class="logout-link"><i class="bi bi-box-arrow-right"></i><span>Sign Out</span></a>
</aside>

<!-- MAIN CONTENT -->
<main class="main-content">
    <div class="profile-card mx-auto">
        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
            <div class="profile-badge" th:text="${citizen != null and citizen.fullName != null and !#strings.isEmpty(citizen.fullName) ? #strings.substring(citizen.fullName, 0, 1).toUpperCase() : 'C'}">
                C
            </div>
            <div>
                <h2 class="h4 fw-bold mb-1" id="profileNameHeading" th:text="${citizen != null ? citizen.fullName : 'Citizen User'}">Citizen User</h2>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle">Verified Citizen</span>
                <span class="text-muted small ms-2" th:if="${citizen != null}">Citizen ID: <strong class="font-monospace" th:text="${citizen.citizenId}">CIT10045</strong></span>
            </div>
        </div>

        <form id="profileForm" onsubmit="handleProfileUpdate(event)">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="profileFullName">Full Name</label>
                    <input type="text" id="profileFullName" class="form-control" th:value="${citizen != null ? citizen.fullName : ''}" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="profileEmail">Email Address (Read-only)</label>
                    <input type="email" id="profileEmail" class="form-control bg-light" th:value="${citizen != null ? citizen.email : ''}" readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="profilePhone">Phone Number</label>
                    <input type="tel" id="profilePhone" class="form-control" th:value="${citizen != null ? citizen.phone : ''}" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="profileCitizenId">Citizen Identification</label>
                    <input type="text" id="profileCitizenId" class="form-control bg-light font-monospace" th:value="${citizen != null ? citizen.citizenId : ''}" readonly>
                </div>

                <div class="col-md-12">
                    <label class="form-label" for="profileAddress">Residential Address</label>
                    <textarea id="profileAddress" class="form-control" rows="3" th:text="${citizen != null ? citizen.address : ''}" placeholder="Enter your full residential address..."></textarea>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4 pt-3 border-top">
                <button type="submit" id="saveBtn" class="btn btn-primary">
                    <i class="bi bi-save me-1"></i> Save Changes
                </button>
                <a href="/citizen/dashboard" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>

<script>
function handleProfileUpdate(event) {
    event.preventDefault();
    const fullName = document.getElementById("profileFullName").value.trim();
    const phone = document.getElementById("profilePhone").value.trim();
    const address = document.getElementById("profileAddress").value.trim();
    const saveBtn = document.getElementById("saveBtn");

    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Saving...';

    fetch('/api/citizen/profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullName: fullName, phone: phone, address: address })
    })
    .then(async response => {
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Failed to update profile.");
        alert("Profile updated successfully!");
        document.getElementById("profileNameHeading").innerText = fullName;
    })
    .catch(err => alert("Error: " + err.message))
    .finally(() => {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="bi bi-save me-1"></i> Save Changes';
    });
}
</script>

</body>
</html>

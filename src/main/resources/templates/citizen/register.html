<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Registration | CivicPulse</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            color: #1e293b;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 560px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .auth-header {
            background: linear-gradient(135deg, #0f2744 0%, #1e3a8a 100%);
            padding: 32px 32px 24px;
            color: white;
            text-align: center;
        }
        .brand-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .auth-header h1 {
            font-size: 1.45rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .auth-header p {
            font-size: 0.86rem;
            color: #93c5fd;
            margin: 4px 0 0;
        }
        .auth-body {
            padding: 28px 32px;
        }
        .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-group-text {
            background: #f8fafc;
            border-color: #cbd5e1;
            color: #64748b;
        }
        .form-control {
            border-color: #cbd5e1;
            padding: 10px 14px;
            font-size: 0.92rem;
            border-radius: 10px;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .btn-primary {
            background: #1e3a8a;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background: #172554;
            transform: translateY(-1px);
        }
        .auth-footer {
            text-align: center;
            padding: 0 32px 28px;
            font-size: 0.88rem;
            color: #64748b;
        }
        .auth-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <div class="brand-icon">
            <i class="bi bi-person-plus-fill"></i>
        </div>
        <h1>Create Citizen Account</h1>
        <p>Join CivicPulse to report and track civic issues in your municipality</p>
    </div>

    <div class="auth-body">
        <!-- Error Alert -->
        <div id="errorAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            <span id="errorMessage">Please correct the form errors.</span>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="row g-3">
                <!-- Full Name -->
                <div class="col-md-6">
                    <label class="form-label" for="fullName">Full Name <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" id="fullName" class="form-control" placeholder="e.g. Ramesh Sharma" required>
                    </div>
                </div>

                <!-- Username -->
                <div class="col-md-6">
                    <label class="form-label" for="username">Username <small class="text-muted fw-normal">(Optional)</small></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-at"></i></span>
                        <input type="text" id="username" class="form-control" placeholder="e.g. ramesh (default: email prefix)">
                    </div>
                </div>

                <!-- Email -->
                <div class="col-md-6">
                    <label class="form-label" for="email">Email Address <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" class="form-control" placeholder="ramesh@example.com" required>
                    </div>
                </div>

                <!-- Phone -->
                <div class="col-md-6">
                    <label class="form-label" for="phone">Phone Number <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                        <input type="tel" id="phone" class="form-control" placeholder="+91 9876543210" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="col-md-6">
                    <label class="form-label" for="password">Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="Minimum 6 chars" minlength="6" required>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="col-md-6">
                    <label class="form-label" for="confirmPassword">Confirm Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" minlength="6" required>
                    </div>
                </div>

                <!-- Address -->
                <div class="col-md-12">
                    <label class="form-label" for="address">Residential Address <span class="text-danger">*</span></label>
                    <textarea id="address" class="form-control" rows="2" placeholder="House No, Street, Ward, City" required></textarea>
                </div>
            </div>

            <div class="form-check mt-3 mb-4">
                <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
                <label class="form-check-label small text-muted" for="termsCheck">
                    I agree to the CivicPulse terms of public grievance reporting and data privacy policy.
                </label>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary w-100 mb-2">
                <span id="btnText">Complete Registration</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
        </form>
    </div>

    <div class="auth-footer">
        Already have a citizen account? <a href="/citizen/login">Sign In here</a>
        <div class="mt-2 pt-2 border-top">
            <small><a href="/portal" class="text-secondary"><i class="bi bi-arrow-left"></i> Back to Main Portal</a></small>
        </div>
    </div>
</div>

<script>
function handleRegister(event) {
    event.preventDefault();
    const fullName = document.getElementById("fullName").value.trim();
    const username = document.getElementById("username") ? document.getElementById("username").value.trim() : "";
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const address = document.getElementById("address").value.trim();

    const errorAlert = document.getElementById("errorAlert");
    const errorMessage = document.getElementById("errorMessage");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const btnSpinner = document.getElementById("btnSpinner");

    errorAlert.classList.add("d-none");

    if (password !== confirmPassword) {
        errorMessage.textContent = "Passwords do not match. Please re-enter.";
        errorAlert.classList.remove("d-none");
        return;
    }

    submitBtn.disabled = true;
    btnText.textContent = "Creating Account...";
    btnSpinner.classList.remove("d-none");

    fetch('/api/citizen/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            fullName: fullName,
            username: username,
            email: email,
            phone: phone,
            password: password,
            confirmPassword: confirmPassword,
            address: address
        })
    })
    .then(async response => {
        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.error || "Registration failed.");
        }
        return data;
    })
    .then(data => {
        alert("Account registered successfully!\nCitizen ID: " + data.citizenId);
        window.location.href = data.redirectUrl || "/citizen/dashboard";
    })
    .catch(err => {
        errorMessage.textContent = err.message;
        errorAlert.classList.remove("d-none");
        submitBtn.disabled = false;
        btnText.textContent = "Complete Registration";
        btnSpinner.classList.add("d-none");
    });
}
</script>

</body>
</html>

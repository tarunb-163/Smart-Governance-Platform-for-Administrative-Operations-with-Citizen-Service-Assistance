spring.application.name=CivicPulse

# =========================
# MYSQL DATABASE
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/civicpulse_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root@2806.}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================
# APPLICATION
# =========================
file.upload-dir=uploads
spring.thymeleaf.cache=false
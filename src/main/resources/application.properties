spring.application.name=CivicPulse

# ===================================================================
# DATABASE CONFIGURATION
# Default: H2 in-memory database (Runs out-of-the-box with zero setup)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:civicpulse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# OPTIONAL: MYSQL CONFIGURATION (Uncomment to use MySQL)
# ===================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/civicpulse?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# APPLICATION SETTINGS
# ===================================================================
# Static uploads directory for complaint images
file.upload-dir=uploads

# Disable Thymeleaf template caching for development
spring.thymeleaf.cache=false
